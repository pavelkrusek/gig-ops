[project]
name = "gig-ops"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pavel Krusek", email = "pavel@krusek.dk" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.100.0",
    "crawl4ai>=0.8.6",
    "loguru>=0.7.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "tavily>=1.1.0",
    "tavily-python>=0.7.24",
    "textual>=8.2.5",
    "typer>=0.25.1",
]

[project.scripts]
gig-ops = "gig_ops:main"
gig = "gig_ops:main"

[build-system]
requires = ["uv_build>=0.11.9,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
markers = [
    "slow: slower tests excluded from the default test run",
]
